# main에 머지될 때마다 목업으로 도는 미리보기 사이트를 GitHub Pages에 올린다.
# 주소: https://kt-dtalent-platform.github.io/frontend/
name: 미리보기 사이트

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 미리보기 빌드 (목업 켬)
        run: npm run build
        env:
          VITE_DEMO: 'true'
          VITE_BASE: /frontend/
      # 새로고침하거나 주소를 바로 열어도 앱이 뜨도록 404 페이지를 앱으로 대신한다
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
