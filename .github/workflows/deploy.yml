# main에 머지될 때마다 실제 서버와 붙는 화면을 S3에 올리고 CloudFront 캐시를 비운다.
# 화면과 API(/v1)는 CloudFront 주소 하나로 묶여 있어서 빌드할 때 서버 주소를 넣지 않는다.
#
# 저장소 변수 3개가 있어야 돈다(Settings → Secrets and variables → Actions → Variables).
#   AWS_DEPLOY_ROLE_ARN         이 레포 main에서만 쓸 수 있는 배포 역할(GitHub OIDC). 키를 레포에 저장하지 않는다
#   FRONTEND_BUCKET             화면 파일을 올릴 S3 버킷 이름
#   CLOUDFRONT_DISTRIBUTION_ID  CloudFront 배포 ID
# 변수가 없으면 배포를 건너뛴다. AWS 준비 전에도 main 머지가 실패로 보이지 않게 하려는 것.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 배포가 겹치면 앞의 것이 끝난 뒤 다음 것을 올린다
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.FRONTEND_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 빌드 (목업 끔)
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: S3에 올리기
        run: |
          # 이름에 내용 해시가 붙은 파일은 바뀌지 않으므로 오래 캐시한다
          aws s3 sync dist/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          # index.html 등은 매번 새로 받게 한다. 목업 파일은 올리지 않는다
          aws s3 sync dist "s3://$BUCKET" --exclude "assets/*" --exclude "mock/*" --exclude "mockServiceWorker.js" --cache-control "no-cache"
          # 지난 배포의 assets는 지우지 않는다. 배포 순간 열려 있던 화면이 예전 파일을 계속 불러올 수 있게
      - name: CloudFront 캐시 비우기
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/"
